[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-cosyvoice-plugin"
version = "0.1.0"
description = "vLLM plugin registration for CosyVoice custom model architecture"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
cosyvoice = "vllm_cosyvoice_plugin:register"

[tool.setuptools]
py-modules = ["vllm_cosyvoice_plugin"]
